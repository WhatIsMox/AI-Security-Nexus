name: Agent Docs & Data Integrity Sync

on:
  push:
    branches: [main, master]
    paths:
      - 'src/data/**'
      - 'src/**'
      - 'scripts/**'
      - 'docs/**'
      - 'package.json'
  pull_request:
    branches: [main, master]
  schedule:
    # Run every Monday at 03:00 UTC to verify freshness and detect drift
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "agent-docs-sync-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript & Build
        run: npm run build

      - name: Run Full Test Suite (Unit, Functional, Security, Build)
        run: npm test

      - name: Validate Data Schema & Referential Integrity
        run: npm run test:data

      - name: Verify Documentation Freshness (CI Check)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: npm run docs:check

      - name: Synchronize Agent Documentation (Schedule / Manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run docs:sync

      - name: Check for Documentation Drift
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: git-check
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and Push Updated Agent Docs (Schedule / Manual Only)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.git-check.outputs.changes_detected == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "chore(docs): auto-sync agent project map and taxonomy stats [skip ci]"
          git push
