name: MITRE ATLAS Automated Synchronization

on:
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mitre-atlas-sync
  cancel-in-progress: true

jobs:
  sync-atlas:
    name: Sync MITRE ATLAS Threat Techniques
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Ingest Latest MITRE ATLAS STIX Bundle
        run: npm run sync:atlas

      - name: Run Test Suite & Data Integrity Assertions
        run: |
          npm test
          npm run test:data

      - name: Synchronize Reference Documentation & Project Maps
        run: npm run docs:sync

      - name: Check for File Changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request for MITRE ATLAS Updates
        if: steps.git-check.outputs.changes_detected == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'feat(atlas): auto-update MITRE ATLAS threat techniques & matrix'
          title: 'feat(atlas): auto-update MITRE ATLAS threat techniques & matrix'
          body: |
            ## 🛡️ Automated MITRE ATLAS Synchronization
            
            This pull request was automatically generated by the [MITRE ATLAS Sync Workflow](https://github.com/${{ github.repository }}/actions/workflows/mitre-atlas-sync.yml).
            
            ### Changes Included:
            - Re-synchronized `src/data/data_mitre_atlas.ts` with the official upstream STIX 2.1 dataset from [mitre-atlas/atlas-data](https://github.com/mitre-atlas/atlas-data).
            - Updated metadata, tactics, techniques, mitigations, and case study mappings.
            - Re-verified test suite passing and refreshed auto-generated documentation (`docs/PROJECT_MAP.md`, `docs/AUTO_GENERATED_STATS.json`).
          branch: auto/mitre-atlas-sync
          delete-branch: true
          labels: |
            security
            automation
            atlas
