name: MITRE ATLAS Automated Synchronization

on:
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "mitre-atlas-sync-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  sync-atlas:
    name: Sync MITRE ATLAS Threat Techniques
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Ingest Latest MITRE ATLAS STIX Bundle
        run: npm run sync:atlas

      - name: Run Test Suite & Data Integrity Assertions
        run: |
          npm test
          npm run test:data

      - name: Synchronize Reference Documentation & Project Maps
        run: npm run docs:sync

      - name: Check for File Changes
        id: git-check
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and Push Updated MITRE ATLAS Data (Schedule / Manual Only)
        if: steps.git-check.outputs.changes_detected == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/data_mitre_atlas.ts docs/
          git diff --staged --quiet || (git commit -m "feat(atlas): auto-sync MITRE ATLAS threat techniques and matrix [skip ci]" && git push)

